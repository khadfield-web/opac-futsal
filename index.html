<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OPAC Futsal — Fixtures, Results & Ladder</title>
<meta name="description" content="Live fixtures, results, ladder and finals for the OPAC lunchtime futsal competition.">
<meta name="theme-color" content="#080b13">
<meta property="og:title" content="OPAC Futsal">
<meta property="og:description" content="Live fixtures, results, ladder and finals.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/logo.jpg">
<link rel="icon" href="assets/logo.jpg">
<link rel="apple-touch-icon" href="assets/logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=6">
</head>
<body>

<header class="topbar no-print">
  <div class="topbar-inner">
    <a class="brand" href="./">
      <img src="assets/logo.jpg" alt="">
      <span>OPAC Futsal</span>
    </a>
    <div class="topbar-spacer"></div>
    <span id="connStatus" class="chip"><span class="dot"></span><span class="label">Connecting</span></span>
    <button id="themeBtn" class="icon-btn" type="button" title="Switch between dark and light" aria-label="Switch between dark and light">◐</button>
    <button id="printBtn" class="icon-btn" type="button" title="Print this page" aria-label="Print this page">⎙</button>
  </div>
</header>

<main class="container">

  <div class="hero">
    <img class="hero-logo" src="assets/logo.jpg" alt="">
    <h1 id="compTitle">OPAC Futsal</h1>
    <p class="sub" id="compSub"></p>
    <div class="hero-meta" id="heroMeta"></div>
  </div>

  <div id="nextUp"></div>

  <div class="tabs no-print" role="tablist" aria-label="Competition sections">
    <button class="tab-btn" role="tab" id="tab-fixtures" aria-controls="panel-fixtures" aria-selected="true" data-tab="fixtures">
      Fixtures <span class="count" id="cnt-fixtures" hidden></span>
    </button>
    <button class="tab-btn" role="tab" id="tab-results" aria-controls="panel-results" aria-selected="false" tabindex="-1" data-tab="results">
      Results <span class="count" id="cnt-results" hidden></span>
    </button>
    <button class="tab-btn" role="tab" id="tab-ladder" aria-controls="panel-ladder" aria-selected="false" tabindex="-1" data-tab="ladder">Ladder</button>
    <button class="tab-btn" role="tab" id="tab-finals" aria-controls="panel-finals" aria-selected="false" tabindex="-1" data-tab="finals">Finals</button>
    <button class="tab-btn" role="tab" id="tab-teams" aria-controls="panel-teams" aria-selected="false" tabindex="-1" data-tab="teams">Teams</button>
  </div>

  <div class="toolbar no-print" id="filterBar" hidden>
    <label class="lbl" for="teamFilter">Show</label>
    <div style="max-width:260px;flex:1">
      <select id="teamFilter"><option value="">All teams</option></select>
    </div>
  </div>

  <section class="tab-panel" id="panel-fixtures" role="tabpanel" aria-labelledby="tab-fixtures" tabindex="0">
    <div class="skeleton"></div><div class="skeleton"></div>
  </section>

  <section class="tab-panel" id="panel-results" role="tabpanel" aria-labelledby="tab-results" tabindex="0" hidden></section>
  <section class="tab-panel" id="panel-ladder" role="tabpanel" aria-labelledby="tab-ladder" tabindex="0" hidden></section>
  <section class="tab-panel" id="panel-finals" role="tabpanel" aria-labelledby="tab-finals" tabindex="0" hidden></section>
  <section class="tab-panel" id="panel-teams" role="tabpanel" aria-labelledby="tab-teams" tabindex="0" hidden></section>

  <p class="sub" style="text-align:center;margin-top:var(--s6);color:var(--text-muted);font-size:0.75rem">
    <span id="updatedAt"></span>
  </p>
</main>

<div class="toasts" aria-live="polite"></div>

<script src="assets/config.js?v=6"></script>
<script src="assets/core.js?v=6"></script>
<script src="assets/public.js?v=6"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
